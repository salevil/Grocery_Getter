<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Sky background -->
  <rect width="200" height="120" fill="#16a34a" rx="16"/>

  <!-- Road -->
  <rect x="0" y="90" width="200" height="30" fill="#374151" rx="0"/>
  <rect x="0" y="88" width="200" height="4" fill="#4b5563"/>
  <!-- Road dashes -->
  <rect x="20" y="93" width="20" height="3" fill="#fbbf24" rx="1"/>
  <rect x="60" y="93" width="20" height="3" fill="#fbbf24" rx="1"/>
  <rect x="100" y="93" width="20" height="3" fill="#fbbf24" rx="1"/>
  <rect x="140" y="93" width="20" height="3" fill="#fbbf24" rx="1"/>

  <!-- Station wagon body -->
  <!-- Main body -->
  <rect x="20" y="55" width="155" height="35" fill="#dc2626" rx="4"/>
  <!-- Roof -->
  <path d="M45 55 L55 30 L145 30 L160 55 Z" fill="#dc2626"/>
  <!-- Roof outline -->
  <path d="M45 55 L55 30 L145 30 L160 55" stroke="#991b1b" stroke-width="1.5" fill="none"/>

  <!-- Wood paneling stripe -->
  <rect x="20" y="65" width="155" height="14" fill="#92400e" rx="0"/>
  <!-- Wood grain lines -->
  <line x1="40" y1="65" x2="40" y2="79" stroke="#78350f" stroke-width="0.8"/>
  <line x1="60" y1="65" x2="60" y2="79" stroke="#78350f" stroke-width="0.8"/>
  <line x1="80" y1="65" x2="80" y2="79" stroke="#78350f" stroke-width="0.8"/>
  <line x1="100" y1="65" x2="100" y2="79" stroke="#78350f" stroke-width="0.8"/>
  <line x1="120" y1="65" x2="120" y2="79" stroke="#78350f" stroke-width="0.8"/>
  <line x1="140" y1="65" x2="140" y2="79" stroke="#78350f" stroke-width="0.8"/>
  <line x1="160" y1="65" x2="160" y2="79" stroke="#78350f" stroke-width="0.8"/>
  <!-- Wood panel border -->
  <rect x="20" y="65" width="155" height="14" fill="none" stroke="#78350f" stroke-width="1"/>

  <!-- Windows -->
  <!-- Front windshield -->
  <path d="M48 53 L56 33 L90 33 L90 53 Z" fill="#bfdbfe" opacity="0.9"/>
  <!-- Middle window -->
  <rect x="93" y="33" width="35" height="20" fill="#bfdbfe" opacity="0.9" rx="1"/>
  <!-- Rear window -->
  <rect x="131" y="33" width="26" height="20" fill="#bfdbfe" opacity="0.9" rx="1"/>

  <!-- Window outlines -->
  <path d="M48 53 L56 33 L90 33 L90 53 Z" stroke="#1e40af" stroke-width="1" fill="none"/>
  <rect x="93" y="33" width="35" height="20" stroke="#1e40af" stroke-width="1" fill="none" rx="1"/>
  <rect x="131" y="33" width="26" height="20" stroke="#1e40af" stroke-width="1" fill="none" rx="1"/>

  <!-- Body outline -->
  <rect x="20" y="55" width="155" height="35" stroke="#991b1b" stroke-width="1.5" fill="none" rx="4"/>

  <!-- Front bumper -->
  <rect x="15" y="78" width="12" height="6" fill="#6b7280" rx="2"/>
  <!-- Rear bumper -->
  <rect x="173" y="78" width="12" height="6" fill="#6b7280" rx="2"/>

  <!-- Headlight -->
  <rect x="17" y="60" width="8" height="5" fill="#fef08a" rx="1"/>
  <rect x="17" y="60" width="8" height="5" stroke="#ca8a04" stroke-width="0.8" fill="none" rx="1"/>

  <!-- Tail light -->
  <rect x="175" y="60" width="8" height="5" fill="#fca5a5" rx="1"/>
  <rect x="175" y="60" width="8" height="5" stroke="#dc2626" stroke-width="0.8" fill="none" rx="1"/>

  <!-- Wheels -->
  <!-- Front wheel -->
  <circle cx="55" cy="90" r="13" fill="#1f2937"/>
  <circle cx="55" cy="90" r="9" fill="#374151"/>
  <circle cx="55" cy="90" r="4" fill="#9ca3af"/>
  <!-- Rear wheel -->
  <circle cx="145" cy="90" r="13" fill="#1f2937"/>
  <circle cx="145" cy="90" r="9" fill="#374151"/>
  <circle cx="145" cy="90" r="4" fill="#9ca3af"/>

  <!-- Shopping cart in rear window (cute detail) -->
  <g transform="translate(136, 36)" opacity="0.7">
    <rect x="2" y="2" width="12" height="8" fill="none" stroke="white" stroke-width="1.2" rx="1"/>
    <line x1="0" y1="2" x2="2" y2="2" stroke="white" stroke-width="1.2"/>
    <circle cx="4" cy="12" r="1.5" fill="white"/>
    <circle cx="10" cy="12" r="1.5" fill="white"/>
  </g>

  <!-- Roof rack -->
  <rect x="55" y="28" width="90" height="3" fill="#6b7280" rx="1"/>
  <rect x="65" y="25" width="3" height="6" fill="#6b7280" rx="1"/>
  <rect x="130" y="25" width="3" height="6" fill="#6b7280" rx="1"/>
</svg>
