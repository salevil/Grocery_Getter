<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Green background -->
  <rect width="512" height="512" fill="#16a34a" rx="80"/>

  <!-- Road -->
  <rect x="0" y="370" width="512" height="142" fill="#374151"/>
  <rect x="0" y="362" width="512" height="16" fill="#4b5563"/>
  <!-- Road dashes -->
  <rect x="40" y="382" width="60" height="10" fill="#fbbf24" rx="3"/>
  <rect x="160" y="382" width="60" height="10" fill="#fbbf24" rx="3"/>
  <rect x="280" y="382" width="60" height="10" fill="#fbbf24" rx="3"/>
  <rect x="400" y="382" width="60" height="10" fill="#fbbf24" rx="3"/>

  <!-- Station wagon body -->
  <rect x="46" y="230" width="420" height="140" fill="#dc2626" rx="12"/>
  <!-- Roof -->
  <path d="M110 230 L140 110 L380 110 L420 230 Z" fill="#dc2626"/>
  <path d="M110 230 L140 110 L380 110 L420 230" stroke="#991b1b" stroke-width="4" fill="none"/>

  <!-- Wood paneling stripe -->
  <rect x="46" y="268" width="420" height="56" fill="#92400e"/>
  <!-- Wood grain lines -->
  <line x1="100" y1="268" x2="100" y2="324" stroke="#78350f" stroke-width="2"/>
  <line x1="160" y1="268" x2="160" y2="324" stroke="#78350f" stroke-width="2"/>
  <line x1="220" y1="268" x2="220" y2="324" stroke="#78350f" stroke-width="2"/>
  <line x1="280" y1="268" x2="280" y2="324" stroke="#78350f" stroke-width="2"/>
  <line x1="340" y1="268" x2="340" y2="324" stroke="#78350f" stroke-width="2"/>
  <line x1="400" y1="268" x2="400" y2="324" stroke="#78350f" stroke-width="2"/>
  <rect x="46" y="268" width="420" height="56" fill="none" stroke="#78350f" stroke-width="2"/>

  <!-- Windows -->
  <path d="M116 226 L143 118 L240 118 L240 226 Z" fill="#bfdbfe" opacity="0.9"/>
  <rect x="248" y="118" width="100" height="108" fill="#bfdbfe" opacity="0.9" rx="4"/>
  <rect x="356" y="118" width="60" height="108" fill="#bfdbfe" opacity="0.9" rx="4"/>

  <!-- Window outlines -->
  <path d="M116 226 L143 118 L240 118 L240 226 Z" stroke="#1e40af" stroke-width="3" fill="none"/>
  <rect x="248" y="118" width="100" height="108" stroke="#1e40af" stroke-width="3" fill="none" rx="4"/>
  <rect x="356" y="118" width="60" height="108" stroke="#1e40af" stroke-width="3" fill="none" rx="4"/>

  <!-- Body outline -->
  <rect x="46" y="230" width="420" height="140" stroke="#991b1b" stroke-width="4" fill="none" rx="12"/>

  <!-- Bumpers -->
  <rect x="30" y="310" width="30" height="22" fill="#6b7280" rx="6"/>
  <rect x="452" y="310" width="30" height="22" fill="#6b7280" rx="6"/>

  <!-- Headlight -->
  <rect x="34" y="248" width="22" height="18" fill="#fef08a" rx="4"/>
  <rect x="34" y="248" width="22" height="18" stroke="#ca8a04" stroke-width="2" fill="none" rx="4"/>

  <!-- Tail light -->
  <rect x="456" y="248" width="22" height="18" fill="#fca5a5" rx="4"/>
  <rect x="456" y="248" width="22" height="18" stroke="#dc2626" stroke-width="2" fill="none" rx="4"/>

  <!-- Wheels -->
  <circle cx="150" cy="368" r="46" fill="#1f2937"/>
  <circle cx="150" cy="368" r="32" fill="#374151"/>
  <circle cx="150" cy="368" r="14" fill="#9ca3af"/>
  <circle cx="370" cy="368" r="46" fill="#1f2937"/>
  <circle cx="370" cy="368" r="32" fill="#374151"/>
  <circle cx="370" cy="368" r="14" fill="#9ca3af"/>

  <!-- Roof rack -->
  <rect x="140" y="104" width="240" height="10" fill="#6b7280" rx="3"/>
  <rect x="160" y="94" width="10" height="22" fill="#6b7280" rx="3"/>
  <rect x="350" y="94" width="10" height="22" fill="#6b7280" rx="3"/>

  <!-- Shopping cart in rear window -->
  <g transform="translate(362, 130)" opacity="0.8">
    <rect x="4" y="4" width="36" height="26" fill="none" stroke="white" stroke-width="4" rx="3"/>
    <line x1="0" y1="4" x2="4" y2="4" stroke="white" stroke-width="4"/>
    <circle cx="12" cy="38" r="5" fill="white"/>
    <circle cx="32" cy="38" r="5" fill="white"/>
  </g>
</svg>
